<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>G-plast Sales Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --bg: #f8fafc;
  --bg2: #ffffff;
  --bg3: #f1f5f9;
  --border: #e2e8f0;
  --border-hover: #cbd5e1;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --imd: #3b82f6;
  --dcd: #f59e0b;
  --trd: #8b5cf6;
  --med: #10b981;
  --export: #06b6d4;
  --domestic: #ef4444;
  --general: #f97316;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  width: 100%;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .tab, .kpi .val {
  font-family: 'Inter', sans-serif;
}

/* ========== ENHANCED LOADING ANIMATION ========== */
#loader {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  z-index: 999;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-container {
  position: relative;
  width: 100px;
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.loader-ring {
  position: absolute;
  width: 80px;
  height: 80px;
  border: 3px solid transparent;
  border-radius: 50%;
  animation: ringPulse 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.loader-ring-1 {
  border-top-color: var(--accent);
  border-right-color: var(--accent);
  animation-delay: 0s;
}

.loader-ring-2 {
  width: 60px;
  height: 60px;
  border-bottom-color: #f59e0b;
  border-left-color: #f59e0b;
  animation-delay: 0.3s;
}

.loader-ring-3 {
  width: 40px;
  height: 40px;
  border-top-color: #10b981;
  border-right-color: #10b981;
  animation-delay: 0.6s;
}

@keyframes ringPulse {
  0% {
    transform: scale(0.8);
    opacity: 0.5;
  }
  50% {
    transform: scale(1);
    opacity: 1;
  }
  100% {
    transform: scale(0.8);
    opacity: 0.5;
  }
}

.loader-logo {
  position: absolute;
  width: 30px;
  height: 30px;
  background: var(--accent);
  border-radius: 50%;
  animation: logoGlow 1.5s ease-in-out infinite;
  box-shadow: 0 0 15px var(--accent);
}

@keyframes logoGlow {
  0%, 100% {
    transform: scale(0.9);
    box-shadow: 0 0 5px var(--accent);
  }
  50% {
    transform: scale(1.1);
    box-shadow: 0 0 25px var(--accent);
  }
}

.loader-text {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--accent), #f59e0b, var(--accent));
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: textShine 2s linear infinite;
}

@keyframes textShine {
  to {
    background-position: 200% center;
  }
}

.loader-progress {
  width: 200px;
  height: 3px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.loader-progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #f59e0b, #10b981);
  border-radius: 3px;
  animation: progressFill 1.8s ease-out forwards;
}

@keyframes progressFill {
  0% { width: 0%; }
  30% { width: 45%; }
  60% { width: 75%; }
  100% { width: 100%; }
}

.loader-dots {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.loader-dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: dotBounce 1.2s ease-in-out infinite;
}

.loader-dot:nth-child(1) { animation-delay: 0s; }
.loader-dot:nth-child(2) { animation-delay: 0.2s; }
.loader-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotBounce {
  0%, 80%, 100% {
    transform: scale(0.6);
    opacity: 0.4;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}

/* Error */
#error {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  text-align: center;
  z-index: 1000;
}
#error.show {
  display: flex;
}
#error h2 {
  color: #dc2626;
  font-size: clamp(18px,5vw,24px);
  font-weight: 600;
}
#error p {
  color: var(--muted);
  font-size: clamp(13px,3.5vw,15px);
  max-width: 90%;
  line-height: 1.6;
}
#error code {
  background: var(--bg3);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--accent);
  display: inline-block;
}

/* Header */
header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 0;
  z-index: 100;
  width: 100%;
}
header h1 {
  font-size: clamp(20px,4vw,24px);
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
header h1 span {
  color: var(--accent);
  font-weight: 600;
}
#meta {
  font-size: clamp(11px,2.5vw,13px);
  color: var(--muted);
  margin-top: 4px;
  font-weight: 500;
}
#refresh-info {
  font-size: clamp(11px,2.5vw,13px);
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-weight: 500;
}
#refresh-info b {
  color: var(--accent);
  font-weight: 600;
}

.btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: clamp(12px,2.5vw,13px);
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
}
.btn:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn:active {
  transform: translateY(0);
}
.btn svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}
.btn-success {
  background: #10b981;
}
.btn-success:hover {
  background: #059669;
}

/* Export buttons */
.export-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--bg2);
  border-radius: 10px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

/* KPI Row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  padding: 20px;
  width: 100%;
}
.kpi {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 14px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
}
.kpi::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(59,130,246,0.05), transparent);
  transition: left 0.5s ease;
  z-index: 1;
  pointer-events: none;
}
.kpi:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-hover);
}
.kpi:hover::before {
  left: 100%;
}
.kpi .label {
  font-size: clamp(10px,2.2vw,12px);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  position: relative;
  z-index: 2;
  font-weight: 600;
}
.kpi .val {
  font-size: clamp(16px,3.5vw,22px);
  font-weight: 700;
  line-height: 1.2;
  word-break: break-word;
  display: inline-block;
  transition: transform 0.2s ease;
  position: relative;
  z-index: 2;
  letter-spacing: -0.02em;
}
.kpi .sub {
  font-size: clamp(10px,2.2vw,12px);
  color: var(--muted);
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  position: relative;
  z-index: 2;
  font-weight: 500;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  overflow-x: auto;
  scrollbar-width: thin;
  width: 100%;
}
.tab {
  font-family: 'Inter', sans-serif;
  font-size: clamp(12px,3vw,14px);
  font-weight: 600;
  padding: 12px 16px;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab:hover {
  color: var(--text);
}
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

#content {
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

/* Filters */
.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: flex-end;
  background: var(--bg2);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  width: 100%;
  box-shadow: var(--shadow-sm);
}
.filters > div {
  flex: 1 1 150px;
  min-width: 130px;
}
.filters label {
  font-size: clamp(10px,2.2vw,12px);
  color: var(--muted);
  display: block;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}
.filters select {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: clamp(13px,2.8vw,14px);
  cursor: pointer;
  outline: none;
  width: 100%;
  font-weight: 500;
  transition: all 0.2s;
}
.filters select:hover {
  border-color: var(--border-hover);
}
.filters select:focus {
  border-color: var(--accent);
  background: var(--bg2);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}
#day-count, #customer-count {
  font-size: clamp(11px,2.5vw,13px);
  color: var(--muted);
  align-self: center;
  background: var(--bg3);
  padding: 8px 14px;
  border-radius: 8px;
  white-space: nowrap;
  font-weight: 500;
}

/* Cards */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  width: 100%;
  transition: box-shadow 0.2s;
}
.card:hover {
  box-shadow: var(--shadow);
}
.card h3 {
  font-size: clamp(14px,3.2vw,16px);
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
  letter-spacing: -0.01em;
}
.card p {
  font-size: clamp(12px,2.5vw,13px);
  color: var(--muted);
  margin-bottom: 16px;
  font-weight: 500;
}
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  width: 100%;
}
.canvas-container {
  position: relative;
  width: 100%;
  min-height: 200px;
  height: auto;
  margin: 0 auto;
  background: var(--bg);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 12px;
}
.canvas-container.medium {
  min-height: 150px;
}
canvas {
  display: block;
  width: 100% !important;
  height: auto !important;
}

/* Responsive */
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; gap: 16px; }
  .kpi-row { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 16px; }
  header { padding: 14px 16px; }
  #content { padding: 16px; }
  .tabs { padding: 0 16px; }
  .filters { padding: 14px; gap: 10px; }
  .filters > div { flex: 1 1 130px; min-width: 110px; }
  .canvas-container { min-height: 180px; }
  .canvas-container.medium { min-height: 140px; }
  .export-buttons { flex-direction: column; }
  .export-buttons .btn { width: 100%; justify-content: center; }
}
@media (max-width: 600px) {
  header { flex-direction: column; align-items: flex-start; gap: 8px; }
  #refresh-info { text-align: left; width: 100%; }
  .kpi-row { padding: 12px; gap: 8px; grid-template-columns: repeat(2, 1fr); }
  .kpi { padding: 12px 10px; border-radius: 10px; }
  .kpi .val { font-size: 16px; }
  .tabs { padding: 0 12px; }
  .tab { padding: 10px 12px; font-size: 12px; }
  #content { padding: 12px; }
  .filters { padding: 12px; gap: 8px; flex-direction: column; align-items: stretch; }
  .filters > div { width: 100%; min-width: 100%; }
  #day-count, #customer-count { width: 100%; text-align: center; white-space: normal; }
  .card { padding: 14px 12px; border-radius: 10px; }
  .two-col { gap: 12px; }
  .canvas-container { min-height: 160px; }
  .canvas-container.medium { min-height: 120px; }
}
@media (max-width: 380px) {
  .kpi-row { gap: 6px; padding: 10px; }
  .kpi { padding: 10px 8px; }
  .kpi .val { font-size: 14px; }
  .tab { padding: 8px 10px; font-size: 11px; }
}
@media (min-width: 1400px) {
  #content { padding: 28px 40px; }
  .kpi-row { padding: 24px 40px; }
  .kpi .val { font-size: 24px; }
  .kpi .label { font-size: 13px; }
  .canvas-container { min-height: 240px; padding: 16px; }
  .canvas-container.medium { min-height: 170px; }
}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-container">
    <div class="loader-ring loader-ring-1"></div>
    <div class="loader-ring loader-ring-2"></div>
    <div class="loader-ring loader-ring-3"></div>
    <div class="loader-logo"></div>
  </div>
  <div class="loader-text">G-plast Dashboard</div>
  <div class="loader-progress">
    <div class="loader-progress-bar"></div>
  </div>
  <div class="loader-dots">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</div>

<div id="error">
  <h2>Could not load data file</h2>
  <p>Make sure <code>data.xlsx</code> is in the same folder as this HTML file.</p>
  <button class="btn" onclick="location.reload()">Retry</button>
</div>

<div id="app" style="display:none;">
  <header>
    <div>
      <h1>Sales <span>Dashboard</span></h1>
      <div id="meta"></div>
    </div>
    <div id="refresh-info">
      <span>Last updated: <b id="last-updated">—</b></span>
      <button class="btn" onclick="manualRefresh()">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path d="M17.65 6.35A8 8 0 1 0 19 12h-2a6 6 0 1 1-2.23-4.69l2.64-2.64 1.42 1.42-3.54 3.54-3.54-3.54 1.41-1.41L16.44 5.3c.38.32.74.68 1.06 1.06z"/>
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <div class="kpi-row" id="kpi-row"></div>

  <div class="tabs">
    <button class="tab active" data-tab="monthly">Monthly Overview</button>
    <button class="tab" data-tab="daily">Day-wise</button>
    <button class="tab" data-tab="customer">Customer Analysis</button>
  </div>

  <div id="content">
    <div id="tab-monthly">
      <div class="export-buttons">
        <button class="btn btn-success" onclick="exportToExcel('monthly')">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
          Export Monthly
        </button>
      </div>
      <div class="card">
        <h3>Combined All Units Monthly Sales</h3>
        <div class="canvas-container"><canvas id="chart-monthly-total"></canvas></div>
      </div>
      <div class="two-col">
        <div class="card">
          <h3>Stacked by Units</h3>
          <div class="canvas-container"><canvas id="chart-monthly-stack"></canvas></div>
        </div>
        <div class="card">
          <h3>Department Share</h3>
          <div class="canvas-container"><canvas id="chart-pie"></canvas></div>
        </div>
      </div>
    </div>

    <div id="tab-daily" style="display:none;">
      <div class="export-buttons">
        <button class="btn btn-success" onclick="exportToExcel('daily')">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
          Export Daily
        </button>
      </div>
      <div class="filters">
        <div><label>Month</label><select id="f-month"><option value="all">All Months</option></select></div>
        <div><label>Units</label><select id="f-dept"><option value="all">All Units</option><option value="IMD">IMD</option><option value="DCD">DCD</option><option value="TRD">TRD</option><option value="MED">MED</option></select></div>
        <div><label>Territory</label><select id="f-territory"><option value="all">All</option><option value="EXPORT">Export</option><option value="DOMESTIC">Domestic</option><option value="GENERAL">General</option></select></div>
        <span id="day-count"></span>
      </div>
      <div class="card">
        <h3>Day-wise Sales</h3>
        <div class="canvas-container medium"><canvas id="chart-daily"></canvas></div>
      </div>
    </div>

    <div id="tab-customer" style="display:none;">
      <div class="export-buttons">
        <button class="btn btn-success" onclick="exportToExcel('customer-overview')">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
          Export Overview
        </button>
      </div>
      <div class="filters">
        <div><label>Ranking</label><select id="fc-ranking"><option value="top10">Top 10 Customers</option><option value="top20">Top 20 Customers</option></select></div>
        <div><label>Month</label><select id="fc-month"><option value="all">All Months</option></select></div>
        <div><label>Units</label><select id="fc-dept"><option value="all">All Units</option><option value="IMD">IMD</option><option value="DCD">DCD</option><option value="TRD">TRD</option><option value="MED">MED</option></select></div>
        <div><label>Territory</label><select id="fc-territory"><option value="all">All</option><option value="EXPORT">Export</option><option value="DOMESTIC">Domestic</option><option value="GENERAL">General</option></select></div>
        <span id="customer-count"></span>
      </div>
      <div class="card">
        <h3>Customer Sales Overview</h3>
        <div class="canvas-container"><canvas id="chart-customer-overview"></canvas></div>
      </div>

      <div class="filters" style="margin-top:20px">
        <div><label>Select Customer</label><select id="fc-customer"><option value="">Select Customer</option></select></div>
        <div><label>Month</label><select id="fc-month-daily"><option value="all">All Months</option></select></div>
        <div><label>Units</label><select id="fc-dept-daily"><option value="all">All Units</option><option value="IMD">IMD</option><option value="DCD">DCD</option><option value="TRD">TRD</option><option value="MED">MED</option></select></div>
        <div><label>Territory</label><select id="fc-territory-daily"><option value="all">All</option><option value="EXPORT">Export</option><option value="DOMESTIC">Domestic</option><option value="GENERAL">General</option></select></div>
      </div>
      <div class="card">
        <h3>Customer Day-wise Sales</h3>
        <div class="canvas-container medium"><canvas id="chart-customer-daily"></canvas></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================
   G-plast Sales Dashboard - Strict Column Mapping
   
   REQUIRED EXCEL COLUMNS (EXACT MATCH):
   - Inv. Date     → Date
   - Unit          → Department/Unit
   - Territory     → Territory
   - Benf. Name    → Customer Name
   - Sale Amt.     → Amount
   
   NO OTHER COLUMN NAMES WILL WORK
   ============================================ */

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DEPTS = ['IMD', 'DCD', 'TRD', 'MED'];
const DEPT_COLORS = { IMD: '#3b82f6', DCD: '#f59e0b', TRD: '#8b5cf6', MED: '#10b981' };
const TER_COLORS = { EXPORT: '#06b6d4', DOMESTIC: '#ef4444', GENERAL: '#f97316' };
const GRID = '#e5e7eb';
const AXIS_TEXT = '#475569';

/* Chart Helpers */
const tooltipCfg = {
  backgroundColor: '#ffffff',
  borderColor: '#e2e8f0',
  borderWidth: 1,
  titleColor: '#000000',
  bodyColor: '#000000',
  titleFont: { family: 'Inter', weight: 'bold', size: 13 },
  bodyFont: { family: 'Inter', weight: '500', size: 12 },
  callbacks: { label: (ctx) => ' ' + fmt(round2(ctx.parsed.y ?? ctx.parsed)) }
};

const axisCfg = {
  color: AXIS_TEXT,
  font: { family: 'Inter', size: window.innerWidth < 600 ? 9 : 11, weight: '500' }
};

const scaleCfg = () => ({
  x: {
    grid: { color: GRID, lineWidth: 0.5 },
    ticks: { ...axisCfg, maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 15 },
    border: { display: false }
  },
  y: {
    grid: { color: GRID, lineWidth: 0.5 },
    ticks: { ...axisCfg, callback: v => fmt(v) },
    border: { display: false }
  }
});

const charts = {};
const mkChart = (id, type, data, opts) => {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id);
  if (ctx) charts[id] = new Chart(ctx, { type, data, options: opts });
};

/* Data Formatting */
const round2 = (v) => Math.round((v + Number.EPSILON) * 100) / 100;

const fmt = (v) => {
  v = round2(v);
  if (v >= 1e7) return (v / 1e7).toFixed(2) + ' Cr';
  if (v >= 1e5) return (v / 1e5).toFixed(2) + ' L';
  return '₹' + v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

/* ========== STRICT COLUMN MAPPING - EXACT NAMES ONLY ========== */
const getCol = (row, exactName) => {
  for (const k of Object.keys(row)) {
    if (k === exactName) return row[k];
  }
  return '';
};

const parseDate = (v) => {
  if (v instanceof Date) return isNaN(v) ? null : new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()));
  if (typeof v === 'number') {
    try {
      const d = XLSX.SSF.parse_date_code(v);
      if (d) return new Date(Date.UTC(d.y, d.m - 1, d.d));
      return null;
    } catch (e) { return null; }
  }
  if (typeof v === 'string' && v.trim()) {
    const p = v.trim().split('.');
    if (p.length === 3) {
      const date = new Date(Date.UTC(+p[2], +p[1] - 1, +p[0]));
      if (!isNaN(date)) return date;
    }
    const fb = new Date(v + 'T00:00:00Z');
    return isNaN(fb) ? null : fb;
  }
  return null;
};

const normTerritory = (v) => {
  const s = String(v).toUpperCase().trim();
  if (s === 'EXPORT' || s === 'EXP') return 'EXPORT';
  if (s === 'DOMESTIC' || s === 'DOM') return 'DOMESTIC';
  if (s === 'GENERAL' || s === 'GEN') return 'GENERAL';
  return s;
};

const monthKey = (d) => MONTHS[d.getMonth()] + ' ' + d.getFullYear();

/* Global State */
let allRows = [];
let totalExcelRows = 0;
let currentMonthlyChartData = null;
let currentDailyChartData = null;
let currentCustomerOverviewData = null;
let currentCustomerDailyData = null;

/* ========== EXCEL PARSER - STRICT COLUMN NAMES ========== */
const parseExcel = (buf) => {
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(ws, { defval: '', blankrows: false });
  totalExcelRows = json.length;

  // Check if required columns exist
  const sampleRow = json[0] || {};
  const requiredCols = ['Inv. Date', 'Unit', 'Territory', 'Benf. Name', 'Sale Amt.'];
  const missingCols = requiredCols.filter(col => !sampleRow.hasOwnProperty(col));
  
  if (missingCols.length > 0) {
    console.warn('Missing columns:', missingCols);
    // Still try to parse with what's available
  }

  return json.map(row => {
    // Get amount from 'Sale Amt.' column
    let amount = 0;
    const saleAmt = row['Sale Amt.'];
    if (saleAmt !== undefined && saleAmt !== '') {
      amount = round2(parseFloat(saleAmt) || 0);
    }

    // Get customer name from 'Benf. Name' column
    let customer = row['Benf. Name'];
    if (customer && typeof customer === 'string') {
      customer = customer.trim();
    } else if (customer) {
      customer = String(customer).trim();
    } else {
      customer = '';
    }

    return {
      date: parseDate(row['Inv. Date']),
      unit: String(row['Unit'] || '').toUpperCase().trim(),
      territory: normTerritory(row['Territory'] || ''),
      customer: customer,
      amt: amount,
    };
  }).filter(r => r.date && r.unit && r.amt > 0);
};

/* KPI Renderer */
const renderKPI = (rows) => {
  const grand = round2(rows.reduce((s, r) => s + r.amt, 0));
  const items = [
    { label: 'Grand Total', val: grand, color: '#1e40af', sub: rows.length.toLocaleString() + ' valid rows · Excel: ' + totalExcelRows, key: 'grand' },
    ...DEPTS.map(d => {
      const v = round2(rows.filter(r => r.unit === d).reduce((s, r) => s + r.amt, 0));
      return { label: d, val: v, color: DEPT_COLORS[d], sub: grand > 0 ? (v / grand * 100).toFixed(1) + '%' : '—', key: d };
    }),
    { label: 'Export', val: round2(rows.filter(r => r.territory === 'EXPORT').reduce((s, r) => s + r.amt, 0)), color: TER_COLORS.EXPORT, sub: 'Export sales', key: 'EXPORT' },
    { label: 'Domestic', val: round2(rows.filter(r => r.territory === 'DOMESTIC').reduce((s, r) => s + r.amt, 0)), color: TER_COLORS.DOMESTIC, sub: 'Domestic sales', key: 'DOMESTIC' },
    { label: 'General', val: round2(rows.filter(r => r.territory === 'GENERAL').reduce((s, r) => s + r.amt, 0)), color: TER_COLORS.GENERAL, sub: 'General sales', key: 'GENERAL' },
  ];
  document.getElementById('kpi-row').innerHTML = items.map(k =>
    `<div class="kpi" data-kpi="${k.key}">
      <div class="label">${k.label}</div>
      <div class="val" style="color:${k.color}">${fmt(k.val)}</div>
      <div class="sub">${k.sub}</div>
    </div>`
  ).join('');
};

/* Monthly Charts */
const renderMonthly = (rows) => {
  const map = {};
  rows.forEach(({ date, unit, amt }) => {
    const mk = monthKey(date);
    if (!map[mk]) map[mk] = { _d: date, total: 0, IMD: 0, DCD: 0, TRD: 0, MED: 0 };
    map[mk].total += amt;
    if (map[mk][unit] !== undefined) map[mk][unit] += amt;
  });

  const sorted = Object.entries(map).sort((a, b) => a[1]._d - b[1]._d);
  const labels = sorted.map(([k]) => k);

  currentMonthlyChartData = {
    labels: labels,
    total: sorted.map(([, v]) => round2(v.total)),
    imd: sorted.map(([, v]) => round2(v.IMD)),
    dcd: sorted.map(([, v]) => round2(v.DCD)),
    trd: sorted.map(([, v]) => round2(v.TRD)),
    med: sorted.map(([, v]) => round2(v.MED))
  };

  mkChart('chart-monthly-total', 'bar', {
    labels,
    datasets: [{
      data: currentMonthlyChartData.total,
      backgroundColor: '#3b82f6',
      borderRadius: 8,
      maxBarThickness: 50,
      hoverBackgroundColor: '#2563eb'
    }]
  }, {
    responsive: true,
    maintainAspectRatio: true,
    plugins: { legend: { display: false }, tooltip: tooltipCfg },
    scales: scaleCfg()
  });

  mkChart('chart-monthly-stack', 'bar', {
    labels,
    datasets: DEPTS.map((d, i) => ({
      label: d,
      data: currentMonthlyChartData[d.toLowerCase()],
      backgroundColor: Object.values(DEPT_COLORS)[i] + 'cc',
      borderColor: '#ffffff',
      borderWidth: 1,
      borderRadius: 4,
      maxBarThickness: 50
    }))
  }, {
    responsive: true,
    maintainAspectRatio: true,
    plugins: {
      legend: { display: true, position: 'top', labels: { color: AXIS_TEXT, font: { size: 11, weight: '500' }, boxWidth: 10, usePointStyle: true } },
      tooltip: tooltipCfg
    },
    scales: { x: { ...scaleCfg().x, stacked: true }, y: { ...scaleCfg().y, stacked: true } }
  });

  const pieTotals = DEPTS.map(d => round2(rows.filter(r => r.unit === d).reduce((s, r) => s + r.amt, 0)));
  mkChart('chart-pie', 'doughnut', {
    labels: DEPTS,
    datasets: [{ data: pieTotals, backgroundColor: Object.values(DEPT_COLORS), borderColor: '#ffffff', borderWidth: 2, hoverOffset: 10 }]
  }, {
    responsive: true, maintainAspectRatio: true, cutout: '60%',
    plugins: { tooltip: tooltipCfg, legend: { position: 'bottom', labels: { color: AXIS_TEXT, font: { size: 11, weight: '500' }, usePointStyle: true } } }
  });
};

/* Daily Chart */
const renderDaily = () => {
  const fMonth = document.getElementById('f-month').value;
  const fDept = document.getElementById('f-dept').value;
  const fTer = document.getElementById('f-territory').value;
  if (!fMonth) return;

  const filtered = allRows.filter(r =>
    (fMonth === 'all' || monthKey(r.date) === fMonth) &&
    (fDept === 'all' || r.unit === fDept) &&
    (fTer === 'all' || r.territory === fTer)
  );

  const dayMap = {};

  if (fMonth === 'all') {
    filtered.forEach(({ date, amt }) => {
      const dk = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      dayMap[dk] = round2((dayMap[dk] || 0) + amt);
    });

    const allDates = Object.keys(dayMap).sort((a, b) => {
      const partsA = a.split(' ');
      const partsB = b.split(' ');
      const dateA = new Date(parseInt(partsA[2]), MONTHS.indexOf(partsA[1]), parseInt(partsA[0]));
      const dateB = new Date(parseInt(partsB[2]), MONTHS.indexOf(partsB[1]), parseInt(partsB[0]));
      return dateA - dateB;
    });

    const data = allDates.map(d => dayMap[d]);
    currentDailyChartData = { labels: allDates, data: data };
    const salesDays = data.filter(v => v > 0).length;
    document.getElementById('day-count').textContent = `${salesDays} days with sales · ${allDates.length - salesDays} days ₹0`;

    mkChart('chart-daily', 'bar', {
      labels: allDates,
      datasets: [{ label: 'Sales', data, backgroundColor: 'rgba(59, 130, 246, 0.6)', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 4, maxBarThickness: 40 }]
    }, { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: tooltipCfg }, scales: scaleCfg() });
    return;
  }

  const [mon, yr] = fMonth.split(' ');
  const monthIndex = MONTHS.indexOf(mon);
  const year = +yr;
  const totalDays = new Date(year, monthIndex + 1, 0).getDate();

  filtered.forEach(({ date, amt }) => {
    const dk = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    dayMap[dk] = round2((dayMap[dk] || 0) + amt);
  });

  const labels = [], data = [];
  for (let d = 1; d <= totalDays; d++) {
    const fullDate = new Date(year, monthIndex, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    labels.push(fullDate);
    data.push(dayMap[fullDate] || 0);
  }

  currentDailyChartData = { labels: labels, data: data };
  const salesDays = data.filter(v => v > 0).length;
  document.getElementById('day-count').textContent = `${salesDays} days with sales · ${totalDays - salesDays} days ₹0`;

  mkChart('chart-daily', 'bar', {
    labels,
    datasets: [{ label: 'Sales', data, backgroundColor: 'rgba(59, 130, 246, 0.6)', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 4, maxBarThickness: 40 }]
  }, { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: tooltipCfg }, scales: scaleCfg() });
};

/* Customer Overview - FULL NAMES, NO TRUNCATION */
const renderCustomerOverview = () => {
  const fRanking = document.getElementById('fc-ranking').value;
  const fMonth = document.getElementById('fc-month').value;
  const fDept = document.getElementById('fc-dept').value;
  const fTer = document.getElementById('fc-territory').value;

  const filtered = allRows.filter(r =>
    (fMonth === 'all' || monthKey(r.date) === fMonth) &&
    (fDept === 'all' || r.unit === fDept) &&
    (fTer === 'all' || r.territory === fTer)
  );

  const customerMap = new Map();
  filtered.forEach(row => {
    if (!row.customer || row.customer === '') return;
    const existing = customerMap.get(row.customer) || 0;
    customerMap.set(row.customer, existing + row.amt);
  });

  let customers = Array.from(customerMap.entries())
    .map(([name, total]) => ({ name: name, total: round2(total) }))
    .filter(c => c.total > 0)
    .sort((a, b) => b.total - a.total);

  const limit = fRanking === 'top10' ? 10 : 20;
  customers = customers.slice(0, limit);

  currentCustomerOverviewData = customers;

  const labels = customers.map(c => c.name);
  const data = customers.map(c => c.total);

  document.getElementById('customer-count').textContent =
    `Showing Top ${limit} customers · Total unique: ${customerMap.size}`;

  mkChart('chart-customer-overview', 'bar', {
    labels,
    datasets: [{
      label: 'Total Sales',
      data,
      backgroundColor: '#3b82f680',
      borderColor: '#3b82f6',
      borderWidth: 1,
      borderRadius: 6,
      maxBarThickness: 50
    }]
  }, {
    responsive: true,
    maintainAspectRatio: true,
    plugins: {
      legend: { display: false },
      tooltip: {
        ...tooltipCfg,
        callbacks: {
          title: (ctx) => ctx[0].label,
          label: (ctx) => ' Total Sales: ' + fmt(ctx.parsed.y)
        }
      }
    },
    scales: {
      x: {
        ...scaleCfg().x,
        ticks: {
          ...axisCfg,
          maxRotation: 45,
          minRotation: 45,
          autoSkip: true,
          maxTicksLimit: 15
        }
      },
      y: scaleCfg().y
    }
  });
};

/* Customer Daily */
const renderCustomerDaily = () => {
  const fMonth = document.getElementById('fc-month-daily').value;
  const fDept = document.getElementById('fc-dept-daily').value;
  const fTer = document.getElementById('fc-territory-daily').value;
  const fCustomer = document.getElementById('fc-customer').value;

  if (!fCustomer) {
    if (charts['chart-customer-daily']) charts['chart-customer-daily'].destroy();
    return;
  }

  const filtered = allRows.filter(r =>
    (fMonth === 'all' || monthKey(r.date) === fMonth) &&
    (fDept === 'all' || r.unit === fDept) &&
    (fTer === 'all' || r.territory === fTer) &&
    r.customer === fCustomer
  );

  const dayMap = {};

  if (fMonth === 'all') {
    filtered.forEach(({ date, amt }) => {
      const dk = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      dayMap[dk] = round2((dayMap[dk] || 0) + amt);
    });

    const allDates = Object.keys(dayMap).sort((a, b) => {
      const partsA = a.split(' ');
      const partsB = b.split(' ');
      const dateA = new Date(parseInt(partsA[2]), MONTHS.indexOf(partsA[1]), parseInt(partsA[0]));
      const dateB = new Date(parseInt(partsB[2]), MONTHS.indexOf(partsB[1]), parseInt(partsB[0]));
      return dateA - dateB;
    });

    const data = allDates.map(d => dayMap[d] || 0);
    currentCustomerDailyData = { labels: allDates, data };

    mkChart('chart-customer-daily', 'bar', {
      labels: allDates,
      datasets: [{
        label: fCustomer,
        data,
        backgroundColor: data.map(v => v > 0 ? '#3b82f680' : '#e5e7eb'),
        borderColor: data.map(v => v > 0 ? '#3b82f6' : '#cbd5e1'),
        borderWidth: 1,
        borderRadius: 4,
        maxBarThickness: 40
      }]
    }, {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false }, tooltip: tooltipCfg },
      scales: scaleCfg()
    });
    return;
  }

  const [mon, yr] = fMonth.split(' ');
  const monthIndex = MONTHS.indexOf(mon);
  const year = +yr;
  const totalDays = new Date(year, monthIndex + 1, 0).getDate();

  filtered.forEach(({ date, amt }) => {
    const dk = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    dayMap[dk] = round2((dayMap[dk] || 0) + amt);
  });

  const labels = [], data = [];
  for (let d = 1; d <= totalDays; d++) {
    const fullDate = new Date(year, monthIndex, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    labels.push(fullDate);
    data.push(dayMap[fullDate] || 0);
  }

  currentCustomerDailyData = { labels, data };

  mkChart('chart-customer-daily', 'bar', {
    labels,
    datasets: [{
      label: fCustomer,
      data,
      backgroundColor: data.map(v => v > 0 ? '#3b82f680' : '#e5e7eb'),
      borderColor: data.map(v => v > 0 ? '#3b82f6' : '#cbd5e1'),
      borderWidth: 1,
      borderRadius: 4,
      maxBarThickness: 40
    }]
  }, {
    responsive: true,
    maintainAspectRatio: true,
    plugins: { legend: { display: false }, tooltip: tooltipCfg },
    scales: scaleCfg()
  });
};

/* Populate Customer Dropdown - EXACT NAMES */
const populateCustomerDropdown = () => {
  const fMonth = document.getElementById('fc-month-daily').value;
  const fDept = document.getElementById('fc-dept-daily').value;
  const fTer = document.getElementById('fc-territory-daily').value;

  const filtered = allRows.filter(r =>
    (fMonth === 'all' || monthKey(r.date) === fMonth) &&
    (fDept === 'all' || r.unit === fDept) &&
    (fTer === 'all' || r.territory === fTer)
  );

  const customers = [...new Set(filtered.map(r => r.customer).filter(c => c && c !== ''))].sort();

  const sel = document.getElementById('fc-customer');
  sel.innerHTML = '<option value="">-- Select Customer (' + customers.length + ') --</option>' +
    customers.map(c => `<option value="${c.replace(/"/g, '&quot;')}">${c}</option>`).join('');
};

/* Populate Months */
const populateMonths = (rows) => {
  const seen = new Set();
  rows.forEach(r => seen.add(monthKey(r.date)));
  const sorted = [...seen].sort((a, b) => {
    const toMs = s => { const [m, y] = s.split(' '); return new Date(+y, MONTHS.indexOf(m)); };
    return toMs(a) - toMs(b);
  });
  const monthsHTML = '<option value="all">All Months</option>' + sorted.map(m => `<option value="${m}">${m}</option>`).join('');

  document.getElementById('f-month').innerHTML = monthsHTML;
  document.getElementById('fc-month').innerHTML = monthsHTML;
  document.getElementById('fc-month-daily').innerHTML = monthsHTML;

  document.getElementById('f-month').value = 'all';
  document.getElementById('fc-month').value = 'all';
  document.getElementById('fc-month-daily').value = 'all';
};

/* Export Functions */
window.exportToExcel = (type) => {
  const wb = XLSX.utils.book_new();

  if (type === 'monthly' && currentMonthlyChartData) {
    const monthlyArray = currentMonthlyChartData.labels.map((label, idx) => ({
      Month: label,
      IMD: currentMonthlyChartData.imd[idx],
      DCD: currentMonthlyChartData.dcd[idx],
      TRD: currentMonthlyChartData.trd[idx],
      MED: currentMonthlyChartData.med[idx],
      Total: currentMonthlyChartData.total[idx]
    }));
    const ws = XLSX.utils.json_to_sheet(monthlyArray);
    XLSX.utils.book_append_sheet(wb, ws, 'Monthly Sales');
  } else if (type === 'daily' && currentDailyChartData) {
    const dailyArray = currentDailyChartData.labels.map((label, idx) => ({
      Date: label,
      Amount: currentDailyChartData.data[idx]
    }));
    const ws = XLSX.utils.json_to_sheet(dailyArray);
    XLSX.utils.book_append_sheet(wb, ws, 'Daily Sales');
  } else if (type === 'customer-overview' && currentCustomerOverviewData) {
    const overviewArray = currentCustomerOverviewData.map(c => ({
      'Customer Name': c.name,
      'Total Sales (₹)': c.total
    }));
    const ws = XLSX.utils.json_to_sheet(overviewArray);
    XLSX.utils.book_append_sheet(wb, ws, 'Customer Overview');
  } else {
    alert('No data to export');
    return;
  }

  XLSX.writeFile(wb, `Sales_Dashboard_${type}_${new Date().toISOString().split('T')[0]}.xlsx`);
};

/* Manual Refresh */
window.manualRefresh = () => {
  const loader = document.getElementById('loader');
  loader.style.display = 'flex';
  loader.classList.remove('hide');

  fetch('data.xlsx?' + Date.now())
    .then(r => { if (!r.ok) throw new Error('data.xlsx not found'); return r.arrayBuffer(); })
    .then(buf => {
      allRows = parseExcel(buf);
      if (!allRows.length) throw new Error('No valid rows found');

      document.getElementById('meta').textContent = allRows.length.toLocaleString() + ' valid rows · Total Excel rows: ' + totalExcelRows;
      document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();

      renderKPI(allRows);
      renderMonthly(allRows);
      populateMonths(allRows);
      populateCustomerDropdown();

      const activeTab = document.querySelector('.tab.active').dataset.tab;
      if (activeTab === 'daily') renderDaily();
      if (activeTab === 'customer') {
        renderCustomerOverview();
        renderCustomerDaily();
      }

      loader.classList.add('hide');
      setTimeout(() => loader.style.display = 'none', 500);
    })
    .catch(err => {
      loader.style.display = 'none';
      const box = document.getElementById('error');
      box.classList.add('show');
      box.querySelector('p').textContent = err.message;
    });
};

/* Event Listeners */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-monthly').style.display = tab === 'monthly' ? 'block' : 'none';
    document.getElementById('tab-daily').style.display = tab === 'daily' ? 'block' : 'none';
    document.getElementById('tab-customer').style.display = tab === 'customer' ? 'block' : 'none';

    if (tab === 'daily') renderDaily();
    if (tab === 'customer') {
      renderCustomerOverview();
      renderCustomerDaily();
    }
  });
});

// Daily filters
['f-month', 'f-dept', 'f-territory'].forEach(id =>
  document.getElementById(id)?.addEventListener('change', renderDaily)
);

// Customer overview filters
['fc-ranking', 'fc-month', 'fc-dept', 'fc-territory'].forEach(id =>
  document.getElementById(id)?.addEventListener('change', renderCustomerOverview)
);

// Customer daily filters
['fc-month-daily', 'fc-dept-daily', 'fc-territory-daily'].forEach(id =>
  document.getElementById(id)?.addEventListener('change', () => {
    populateCustomerDropdown();
    renderCustomerDaily();
  })
);

document.getElementById('fc-customer')?.addEventListener('change', renderCustomerDaily);

/* Initial Load */
const loadData = () => {
  fetch('data.xlsx?' + Date.now())
    .then(r => { if (!r.ok) throw new Error('data.xlsx not found'); return r.arrayBuffer(); })
    .then(buf => {
      allRows = parseExcel(buf);
      if (!allRows.length) throw new Error('No valid rows found');

      const loader = document.getElementById('loader');
      loader.classList.add('hide');
      setTimeout(() => loader.style.display = 'none', 500);

      document.getElementById('app').style.display = 'block';
      document.getElementById('meta').textContent = allRows.length.toLocaleString() + ' valid rows · Total Excel rows: ' + totalExcelRows;
      document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();

      renderKPI(allRows);
      renderMonthly(allRows);
      populateMonths(allRows);
      populateCustomerDropdown();
      renderCustomerOverview();
    })
    .catch(err => {
      document.getElementById('loader').style.display = 'none';
      const box = document.getElementById('error');
      box.classList.add('show');
      box.querySelector('p').textContent = err.message;
    });
};

loadData();
</script>
</body>
</html>
